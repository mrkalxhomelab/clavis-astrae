<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabularium</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: var(--night); min-height: 0; }
  .pop { width: 280px; padding: 18px; background: var(--night); color: var(--parchment); text-align: center; }
  .pop h1 { font-family: 'Cinzel', serif; letter-spacing: .14em; font-size: 18px; margin: 6px 0 2px; }
  .pop p { font-style: italic; color: var(--gold-bright); font-size: 14px; margin: 0 0 14px; }
  .pop img { width: 48px; height: 48px; }
</style>
</head>
<body>
<div class="pop">
  <img src="icons/icon-128.png" alt="">
  <h1>TABULARIUM</h1>
  <p>De occultis stellarum</p>
  <button class="btn block" id="open">APERI <small>open</small></button>
</div>
<script src="src/popup.js"></script>
</body>
</html>
